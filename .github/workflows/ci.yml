name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Skills and bookmark safety
    runs-on: ${{ vars.SKILLS_RUNS_ON && (startsWith(vars.SKILLS_RUNS_ON, '[') && fromJSON(vars.SKILLS_RUNS_ON) || vars.SKILLS_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Claude manifest validation when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo 'Claude CLI unavailable; pinned community schemas validated above.'
          fi
